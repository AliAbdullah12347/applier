[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applier"
version = "0.1.0"
description = "Autonomous end-to-end job discovery and application system"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
applier = "applier.cli:main"

[tool.setuptools]
packages = ["applier", "applier.llm", "applier.apply", "applier.apply.adapters",
            "applier.discover", "applier.score", "applier.tailor",
            "applier.track", "applier.report", "applier.util",
            "applier.web", "applier.outreach"]

# The GUI is plain files served off disk -- no bundler, no build step -- so the
# static tree has to ship with the package or `applier gui` serves 404s.
[tool.setuptools.package-data]
"applier.web" = ["static/*.html", "static/*.css", "static/*.js", "static/panels/*.js"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
